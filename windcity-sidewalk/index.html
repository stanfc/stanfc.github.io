<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<style>
/* Layout: full-bleed 3D street, HUD pinned top, tap halves fill screen; single dusk-grey look by choice */
:root{
  --sky:#9fb3bf; --ink:#14212b; --paper:#f3f1ea; --brick:#b5553a; --warn:#ffcf3a; --danger:#e8402b;
  --glass:rgba(20,33,43,.72);
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f-display);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.chip{background:var(--glass);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl{font-size:11px;letter-spacing:.12em;opacity:.7;font-weight:500}
.dist{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.dist small{font-size:14px;font-weight:700;margin-left:2px}
.wind{display:flex;align-items:center;gap:10px;text-align:right}
.wind .big{font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.wind .ms{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
#arrow{width:40px;height:40px;transition:transform .25s}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--warn);border-radius:3px}
.gust{position:fixed;left:50%;top:32%;transform:translateX(-50%) rotate(-4deg);z-index:6;pointer-events:none;font-size:44px;font-weight:900;color:var(--warn);text-shadow:0 3px 0 var(--ink),0 0 18px rgba(0,0,0,.4);letter-spacing:.06em;white-space:nowrap}
.edge{position:fixed;top:0;bottom:0;width:22%;z-index:3;pointer-events:none;opacity:0;transition:opacity .15s}
#edgeL{left:0;background:linear-gradient(90deg,rgba(232,64,43,.55),transparent)}
#edgeR{right:0;background:linear-gradient(270deg,rgba(232,64,43,.55),transparent)}
.beep{position:absolute;top:45%;font-size:30px;font-weight:900;color:var(--warn);text-shadow:0 2px 0 var(--ink)}
#edgeL .beep{left:max(16px,env(safe-area-inset-left,0px))}
#edgeR .beep{right:max(16px,env(safe-area-inset-right,0px))}
.taps{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:space-between;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tap{width:64px;height:64px;border-radius:50%;border:2px solid rgba(243,241,234,.5);display:grid;place-items:center;
  font-size:26px;font-weight:900;background:rgba(20,33,43,.35);transition:transform .06s,background .06s}
.tap.on{transform:scale(.88);background:rgba(255,207,58,.55)}
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(20,33,43,.55);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:26px 22px 22px;max-width:360px;width:100%;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(90deg,var(--brick) 0 22px,#c9694c 22px 44px)}
.card h1{margin:0;font-size:40px;font-weight:900;line-height:1.05;letter-spacing:.02em;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--brick)}
.card p{margin:0;font-size:14px;line-height:1.7;color:#3a4650}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;line-height:1.5;color:#3a4650}
.rules b{color:var(--ink)}
.btn{appearance:none;border:0;border-radius:12px;background:var(--ink);color:var(--paper);font:900 18px var(--f-display);
  padding:14px;cursor:pointer;letter-spacing:.1em}
.btn:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);font-size:14px;padding:10px}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:#e6e2d6;border-radius:10px;padding:10px 12px}
.stat .v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:#6b747a;letter-spacing:.06em}
.alt{font-size:13px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.alt b{font-size:18px;font-weight:900}
#flip{top:40%;color:#fff;font-size:38px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{flex:none;width:44px;height:26px;border-radius:13px;background:#c9c4b6;position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.toggle input:checked+.sw{background:var(--brick)}
.toggle input:checked+.sw::after{transform:translateX(18px)}
.toggle input:focus-visible+.sw{outline:3px solid var(--warn);outline-offset:2px}
.toggle small{display:block;font-size:11px;font-weight:500;color:#6b747a}
.shout{position:fixed;left:0;top:0;z-index:6;pointer-events:none;white-space:nowrap;font-size:22px;font-weight:900;letter-spacing:.04em;
  text-shadow:0 2px 0 var(--ink),0 0 10px rgba(0,0,0,.45);animation:shout .95s ease-out forwards}
.shout span{display:block;transform:translate(-50%,-100%) rotate(var(--rot,0deg))}
@keyframes shout{0%{opacity:0;scale:.3}14%{opacity:1;scale:1.25}28%{scale:1}75%{opacity:1}100%{opacity:0;translate:0 -26px}}
@media (prefers-reduced-motion:reduce){#arrow,.tap,.toggle .sw,.toggle .sw::after{transition:none}.shout{animation:none}}
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="chip">
    <div class="lbl">走了</div>
    <div class="dist"><span id="dist">0</span><small>公尺</small></div>
    <div class="alt" id="altRow" hidden>高度 <b id="alt">0.0</b> m</div>
  </div>
  <div class="chip wind">
    <div>
      <div class="lbl" id="windName">東北季風</div>
      <div class="big" id="beau">0 級</div>
      <div class="ms" id="ms">0.0 m/s</div>
      <div class="ms" id="vms" hidden>↑ 0.0 m/s</div>
      <div class="meter"><i id="meter"></i></div>
    </div>
    <svg id="arrow" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 20h24M20 10l10 10-10 10" fill="none" stroke="#ffcf3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

<div class="gust" id="gust" hidden>強陣風!</div>
<div class="gust" id="flip" hidden>傘開花了!</div>
<div id="shouts" aria-hidden="true"></div>
<div class="edge" id="edgeL"><span class="beep">叭!</span></div>
<div class="edge" id="edgeR"><span class="beep">叭!</span></div>

<div class="taps" aria-hidden="true"><div class="tap" id="tapL">←</div><div class="tap" id="tapR">→</div></div>

<div class="screen" id="startScreen">
  <div class="card">
    <h1>風城<em>人行道</em></h1>
    <p>十月，九降風開始吹。你要沿著新竹的人行道一直走下去，兩邊都是機車。</p>
    <div class="rules normalOnly">
      <b>點左半邊</b><span>往左修正一步</span>
      <b>點右半邊</b><span>往右修正一步</span>
      <b>風越大</b><span>每步一樣大，所以要點越多下</span>
      <b>叭!</b><span>那一側有機車靠近，別被吹過去</span>
    </div>
    <div class="rules hardOnly" hidden>
      <b>點左／右半邊</b><span>往左／右修正一步</span>
      <b>上升氣流</b><span>撐著傘會被吹上天，高度你管不了</span>
      <b>傘開花</b><span>會突然往下掉，小心掉回車道</span>
      <b>天上</b><span>米粉、柿餅、晶圓都在飛，左右閃開</span>
    </div>
    <label class="toggle"><input type="checkbox" class="hardToggle"><span class="sw"></span><span>困難模式<small>撐傘，多了上下的風</small></span></label>
    <button class="btn" id="startBtn" type="button">開始走</button>
    <div class="foot">電腦也可以用 ← → 或 A D</div>
  </div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <h1 id="overTitle">被機車<em>撞了</em></h1>
    <p id="overMsg">風太大，你被吹進車道。</p>
    <div class="stat">
      <div><div class="lbl" style="color:#6b747a">這次</div><div class="v" id="finalDist">0 m</div></div>
      <div><div class="lbl" style="color:#6b747a" id="bestLbl">最遠</div><div class="v" id="bestDist">0 m</div></div>
    </div>
    <label class="toggle"><input type="checkbox" class="hardToggle"><span class="sw"></span><span>困難模式<small>下一局生效</small></span></label>
    <button class="btn" id="againBtn" type="button">再走一次</button>
    <button class="btn alt" id="muteBtn" type="button">風聲：開</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const SKY=0x9fb3bf;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,25,85);
const camera=new THREE.PerspectiveCamera(60,1,0.1,200);

scene.add(new THREE.HemisphereLight(0xdfe8ee,0x5a5048,0.85));
const sun=new THREE.DirectionalLight(0xfff1dc,0.75);
sun.position.set(-8,14,6);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:12,bottom:-12,near:1,far:40});
scene.add(sun);scene.add(sun.target);

// ---------- textures ----------
function canvasTex(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rx)t.repeat.set(rx,ry);t.anisotropy=4;return t;
}
const brickTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#8e4a36';g.fillRect(0,0,w,h);
  const cols=['#b5553a','#a94d34','#c06244','#b85a3f','#9f4b33'];
  for(let r=0;r<8;r++)for(let c=-1;c<5;c++){
    const x=c*64+(r%2?32:0),y=r*32;g.fillStyle=cols[(r*7+c*3+9)%5];g.fillRect(x+2,y+2,60,28);
  }
},2,8);
const roadTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#3d4247';g.fillRect(0,0,w,h);
  for(let i=0;i<2500;i++){const v=50+Math.random()*30|0;g.fillStyle=`rgb(${v},${v+3},${v+6})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}
},2,8);
function signTex(text,bg,fg){
  return canvasTex(256,96,(g,w,h)=>{
    g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.font='900 56px "Noto Sans TC","PingFang TC",sans-serif';
    g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+4);
  });
}
const SIGNS=[['新竹米粉','#c8202a','#fff5d6'],['貢丸湯','#f2c230','#14212b'],['風城','#1e5fa8','#ffffff'],
  ['城隍廟口','#7a1d1d','#ffd56a'],['摃丸專賣','#0f7a52','#ffffff'],['機車行','#14212b','#ffcf3a'],['肉圓','#e06a1b','#ffffff'],['手搖飲','#6b3fa0','#ffffff'],['賣噹噹','#da291c','#ffc72c']]
  .map(s=>new THREE.MeshLambertMaterial({map:signTex(...s)}));

// ---------- street segments ----------
const SEG=24, NSEG=6;
const SIDE=1.6, LANE_IN=1.85, LANE_OUT=3.7, LANE_C=2.75;
const mat={
  brick:new THREE.MeshLambertMaterial({map:brickTex}),
  road:new THREE.MeshLambertMaterial({map:roadTex}),
  curb:new THREE.MeshLambertMaterial({color:0xcfcac0}),
  yellow:new THREE.MeshBasicMaterial({color:0xf2c230}),
  white:new THREE.MeshBasicMaterial({color:0xeeeeee}),
  pole:new THREE.MeshLambertMaterial({color:0x6c7378}),
  tree:new THREE.MeshLambertMaterial({color:0x3e6b45}),
  trunk:new THREE.MeshLambertMaterial({color:0x5b4636})
};
const bColors=[0xd9d2c3,0xbfc6c4,0xe3d9c6,0xa9b2b0,0xcbbfa8,0xd4cfc7,0xb8aea0];
const segments=[];
function makeSegment(){
  const g=new THREE.Group();
  const sw=new THREE.Mesh(new THREE.PlaneGeometry(SIDE*2,SEG),mat.brick);sw.rotation.x=-Math.PI/2;sw.position.y=0.15;sw.receiveShadow=true;g.add(sw);
  [-1,1].forEach(s=>{
    const curb=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.18,SEG),mat.curb);curb.position.set(s*(SIDE+0.12),0.09,0);g.add(curb);
    const road=new THREE.Mesh(new THREE.PlaneGeometry(LANE_OUT-LANE_IN+0.4,SEG),mat.road);road.rotation.x=-Math.PI/2;
    road.position.set(s*(LANE_IN+LANE_OUT)/2,0,0);road.receiveShadow=true;g.add(road);
    // red-yellow kerb paint no-parking line
    const ln=new THREE.Mesh(new THREE.PlaneGeometry(0.12,SEG),mat.yellow);ln.rotation.x=-Math.PI/2;ln.position.set(s*LANE_IN,0.01,0);g.add(ln);
    for(let i=0;i<4;i++){const d=new THREE.Mesh(new THREE.PlaneGeometry(0.12,2.5),mat.white);d.rotation.x=-Math.PI/2;d.position.set(s*LANE_OUT,0.01,-SEG/2+3+i*6);g.add(d);}
    // far side: arcade buildings (騎樓)
    const bl=new THREE.Group();g.add(bl);bl.userData.side=s;
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(14,SEG),mat.curb);ground.rotation.x=-Math.PI/2;ground.position.set(s*(LANE_OUT+7.2),0.12,0);g.add(ground);
  });
  g.userData.dyn=new THREE.Group();g.add(g.userData.dyn);
  scene.add(g);return g;
}
function dressSegment(g){
  const dyn=g.userData.dyn;
  while(dyn.children.length){const c=dyn.children.pop();if(c.geometry&&!c.userData.shared)c.geometry.dispose();}
  [-1,1].forEach(s=>{
    let z=-SEG/2;
    while(z<SEG/2-1){
      const w=3+Math.random()*3, h=7+Math.random()*12, d=6;
      const b=new THREE.Mesh(new THREE.BoxGeometry(d,h,w-0.15),new THREE.MeshLambertMaterial({color:bColors[Math.random()*bColors.length|0]}));
      b.position.set(s*(LANE_OUT+2.6+d/2),h/2,z+w/2);b.castShadow=true;dyn.add(b);
      // window strips
      for(let f=1;f<h/3;f++){const wn=new THREE.Mesh(new THREE.PlaneGeometry(w*0.7,0.9),new THREE.MeshLambertMaterial({color:0x51636f}));
        wn.position.set(s*(LANE_OUT+2.58),f*3+1.5,z+w/2);wn.rotation.y=-s*Math.PI/2;dyn.add(wn);}
      if(Math.random()<0.75){
        const sg=new THREE.Mesh(new THREE.PlaneGeometry(2.4,0.9),SIGNS[Math.random()*SIGNS.length|0]);
        sg.position.set(s*(LANE_OUT+2.55),3.1,z+w/2);sg.rotation.y=-s*Math.PI/2;dyn.add(sg);
      }
      z+=w;
    }
    // parked scooter row in arcade
    for(let i=0;i<5;i++){if(Math.random()<0.6){const p=makeScooter(true);p.rotation.y=s*Math.PI/2;p.position.set(s*(LANE_OUT+1.3),0.12,-SEG/2+2+i*4.6+Math.random());dyn.add(p);}}
  });
  // trees & lamp poles on the sidewalk edge
  for(let i=0;i<2;i++){
    const s=Math.random()<.5?-1:1, z=-SEG/2+4+i*12+Math.random()*4;
    if(Math.random()<0.5){
      const t=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.11,2.2,6),mat.trunk);t.position.set(s*1.45,1.25,z);t.castShadow=true;dyn.add(t);
      const c=new THREE.Mesh(new THREE.IcosahedronGeometry(0.8,0),mat.tree);c.position.set(s*1.45,2.6,z);c.castShadow=true;c.userData.sway=true;dyn.add(c);
    }else{
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,4.2,6),mat.pole);p.position.set(s*1.5,2.25,z);p.castShadow=true;dyn.add(p);
      const flag=new THREE.Mesh(new THREE.PlaneGeometry(0.5,1.1),new THREE.MeshLambertMaterial({color:[0xc8202a,0x1e5fa8,0xf2c230][Math.random()*3|0],side:THREE.DoubleSide}));
      flag.position.set(s*1.5,3.4,z);flag.userData.flag=true;dyn.add(flag);
    }
  }
}

// ---------- scooters ----------
const scootCols=[0xe8e4dc,0x2f5fa8,0xc8202a,0x1d1f22,0x8fb8c4,0xf2c230,0x6d7c4f];
const helmCols=[0xffffff,0xf2c230,0x2f5fa8,0xe06a1b,0x1d1f22];
const wheelGeo=new THREE.CylinderGeometry(0.24,0.24,0.12,12);wheelGeo.rotateZ(Math.PI/2);
const wheelMat=new THREE.MeshLambertMaterial({color:0x1a1a1a});
function makeScooter(parked){
  const g=new THREE.Group();
  const col=scootCols[Math.random()*scootCols.length|0];
  const bm=new THREE.MeshLambertMaterial({color:col});
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.45,1.3),bm);body.position.set(0,0.5,0.1);body.castShadow=true;g.add(body);
  const front=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.8,0.25),bm);front.position.set(0,0.75,-0.55);front.castShadow=true;g.add(front);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.06,0.06),mat.pole);bar.position.set(0,1.18,-0.55);g.add(bar);
  [-0.7,0.75].forEach(z=>{const w=new THREE.Mesh(wheelGeo,wheelMat);w.position.set(0,0.24,z);g.add(w);});
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.12,0.04),new THREE.MeshBasicMaterial({color:0xfff6c4}));lamp.position.set(0,1.0,-0.69);g.add(lamp);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.08,0.04),new THREE.MeshBasicMaterial({color:0xff3322}));tail.position.set(0,0.75,0.77);g.add(tail);
  if(!parked){

// ---------- audio: filtered noise follows wind ----------
let ac=null,windGain=null,windFilt=null,muted=false;
function initAudio(){
  if(ac)return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){last=(last+0.04*(Math.random()*2-1))/1.04;d[i]=last*3.5;}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    windFilt=ac.createBiquadFilter();windFilt.type='bandpass';windFilt.Q.value=0.8;windFilt.frequency.value=400;
    windGain=ac.createGain();windGain.gain.value=0;
    src.connect(windFilt).connect(windGain).connect(ac.destination);src.start();
  }catch(e){ac=null;}
}
function beepSound(){
  if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=440;
  g.gain.setValueAtTime(0.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.25);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+0.26);
}

  gwR:['被後面的貢丸','撞了','風把你推進右邊車道，後面有人騎著貢丸衝過來。'],
  mifen:['被米粉','甩臉了','九降風是曬米粉的好天氣，一整把米粉被吹上天，迎面甩過來。'],
  shibing:['被柿餅','砸中了','新埔的柿餅也在曬，被風一起捲上來了。'],
  wafer:['被晶圓','打中了','竹科的晶圓被吹出來了。這片你賠不起。'],
  nycu:['被交大招牌','砸中了','交大的招牌被吹下來，飛過光復路直直朝你來。'],
  nthu:['被清大招牌','砸中了','清大的招牌也被吹飛了，梅竹賽在空中延長賽。'],
  bigcity:['被巨城碎片','打中了','連巨城都被吹掉一塊，你還想在路上走？'],
  xiaochao:['被客家小炒','糊臉了','一整盤客家小炒被吹過來，魷魚還黏在你臉上。']
};
function die(kind,dir){
  state='dead';deadT=0;hitDir=dir||Math.sign(px)||1;shake=0.6;deathY=py;
  $('flip').hidden=true;$('gust').hidden=true;
  const dd=Math.floor(dist);
  let best=loadBest();
  if(dd>best){best=dd;try{localStorage.setItem(bestKey(),best);}catch(e){}}
  $('finalDist').textContent=dd+' m';$('bestDist').textContent=best+' m';
  $('bestLbl').textContent=hard?'最遠（困難）':'最遠';
  const [title,em,msg]=DEATHS[kind];
  const bucket=dd<100?'0-99':dd<200?'100-199':dd<300?'200-299':dd<500?'300-499':'500+';
  track('death-'+mode()+'-'+kind,title+em);
  track('dist-'+mode()+'-'+bucket,bucket+' m');
  $('overTitle').innerHTML=title+'<em>'+em+'</em>';
  $('overMsg').textContent=msg+(dd>=300?' 在新竹撐了 '+dd+' 公尺，算是在地人了。':'');
  beepSound();
}

// ---------- loop ----------
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<h?72:58;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
  if(state==='play'){
    phaseT-=dt;if(phaseT<=0)nextPhase();
    const gust=Math.sin(t*3.1)*0.12+Math.sin(t*7.3)*0.08;
    wind+=(windTarget-wind)*Math.min(1,dt*3.4);
    gustCD-=dt;
    if(gustCD<=0&&gustT<=0&&Math.abs(wind)>0.4){gustT=0.9;gustAmt=Math.sign(wind)*(0.9+Math.random()*0.7+Math.min(1,dist/350)*0.8);gustCD=1.8+Math.random()*2.5;$('gust').hidden=false;shake=Math.max(shake,0.25);
      // strong gusts can turn the umbrella inside out
      if(hard&&flipT<=0&&py>1.5&&Math.random()<0.3+(windV>0.6?0.2:0)){flipT=2.0;$('flip').hidden=false;}}
    if(gustT>0){gustT-=dt;if(gustT<=0){gustAmt=0;$('gust').hidden=true;}}
    gustVis+=(gustAmt-gustVis)*Math.min(1,dt*8);
    const drift=(wind*(1+gust)+gustVis)*(hard?(flipT>0?0.85:1.1):1);
    if(hard){
      phaseVT-=dt;if(phaseVT<=0)nextPhaseV();
      windV+=(windVTarget-windV)*Math.min(1,dt*2.5);
      if(flipT>0){flipT-=dt;if(flipT<=0)$('flip').hidden=true;}
      // no vertical control: updrafts set the altitude you drift toward, a flipped umbrella drops you
      const pyTarget=flipT>0?0:Math.max(0,Math.min(PY_MAX,windV*7));
      py+=(pyTarget-py)*Math.min(1,dt*(flipT>0?2.2:0.9));
      spawnSky-=dt;
      if(spawnSky<=0){spawnSkyThing();spawnSky=1.1+Math.random()*(1.2-Math.min(1,dist/700)*0.5);}
    }
    // apply nudge smoothly over NUDGE_TIME, constant total per tap
    const take=Math.sign(vxNudge)*Math.min(Math.abs(vxNudge),STEP/NUDGE_TIME*dt);
    vxNudge-=take;
    px+=drift*dt+take;
    px=Math.max(-3.9,Math.min(3.9,px));
    pz-=WALK*dt;dist+=WALK*dt;walk+=dt*WALK*2.6;
    // spawns
    const lf=Math.min(1,dist/700);
    spawnL-=dt;spawnR-=dt;
    if(spawnL<=0){spawn(-1);spawnL=0.7+Math.random()*(1.6-lf*0.7);}
    if(spawnR<=0){spawn(1);spawnR=0.8+Math.random()*(1.7-lf*0.7);}
  }else if(state==='dead'){
    deadT+=dt;
    player.position.x+=hitDir*dt*3*Math.max(0,1-deadT);
    player.rotation.z=-hitDir*Math.min(Math.PI/2,deadT*5);
    if(deathY>0.5)player.position.y=Math.max(0,deathY+Math.sin(Math.min(Math.PI,deadT*4))*0.8-6*deadT*deadT);
    else player.position.y=Math.max(0,Math.sin(Math.min(Math.PI,deadT*4))*0.8);
    if(deadT>0.9&&$('overScreen').hidden){$('overScreen').hidden=false;}
    wind*=0.99;
  }else{ // menu: idle demo
    wind=Math.sin(t*0.4)*0.7;walk+=dt*3;pz-=dt*1.2;
  }

  // scooters
  let warnL=false,warnR=false;
  for(let i=scooters.length-1;i>=0;i--){
    const s=scooters[i];s.m.position.z+=s.v*dt;
    s.m.rotation.z=Math.sin(t*2+i)*0.03;
    if(s.gw)s.m.userData.ball.rotation.x-=Math.abs(s.v)*dt/GW_R;
    const dz=s.m.position.z-pz;
    if(state==='play'&&py<GROUND_HIT){
      const near=s.v>0?(dz<0&&dz>-26):(dz>0&&dz<16);
      const risky=Math.abs(px)>SIDE-0.35;
      if(near&&risky&&Math.sign(px)===s.side){if(s.side<0)warnL=true;else warnR=true;
        if(!s.warned){s.warned=true;beepSound();}}
      if(Math.abs(px-s.m.position.x)<s.hx&&Math.abs(dz)<s.hz){die((s.gw?'gw':'scooter')+(s.side<0?'L':'R'));}
    }
    if((s.v>0&&dz>12)||(s.v<0&&dz<-90)){scene.remove(s.m);scooters.splice(i,1);}
  }
  $('edgeL').style.opacity=warnL?1:0;$('edgeR').style.opacity=warnR?1:0;

  // sky obstacles
  shoutCD-=dt;
  for(let i=sky.length-1;i>=0;i--){
    const o=sky[i];
    o.m.position.z+=o.vz*dt;o.m.position.x+=(wind+gustVis)*SKY_DRIFT*dt;
    // carried by the same updraft, so it settles toward the player's height
    o.m.position.y+=(py+1.1+o.yOff-o.m.position.y)*Math.min(1,dt*1.2);
    o.m.rotation.x+=o.spin*dt;o.m.rotation.z+=o.spin*0.6*dt;
    const dz=o.m.position.z-pz;
    if(state==='play'&&Math.abs(dz)<0.6&&Math.hypot(px-o.m.position.x,py+1.1-o.m.position.y)<o.r)die(o.kind,Math.sign(px-o.m.position.x)||1);
    if(state==='play'&&!o.shouted&&SHOUTS[o.kind]&&dz>-13&&dz<-4&&Math.abs(px-o.m.position.x)<1.6&&Math.abs(py+1.1-o.m.position.y)<1.6){o.shouted=true;if(shoutCD<=0&&Math.random()<SHOUT_CHANCE){shout(o);shoutCD=SHOUT_GAP;}}
    if(o.el){_v.copy(o.m.position).project(camera);o.el.style.transform=`translate(${(_v.x+1)/2*innerWidth}px,${(1-_v.y)/2*innerHeight-18}px)`;}
    if(dz>12){scene.remove(o.m);if(o.el)o.el.remove();sky.splice(i,1);}
  }

  // recycle segments
  segments.forEach(g=>{if(g.position.z-SEG/2>pz+10){g.position.z-=SEG*NSEG;dressSegment(g);}});

  // player pose
  if(state!=='dead'){
    player.position.set(state==='menu'?Math.sin(t*0.4)*0.3:px,py,pz);
    const sw=Math.sin(walk), airborne=py>0.3;
    // dangling, kicking legs once the umbrella lifts you off the ground
    if(airborne){legL.rotation.x=Math.sin(t*9)*0.35;legR.rotation.x=-Math.sin(t*9)*0.35;}
    else{legL.rotation.x=sw*0.6;legR.rotation.x=-sw*0.6;}
    armL.rotation.x=-sw*0.5;armR.rotation.x=sw*0.5;
    lean.position.y=airborne?0:Math.abs(Math.cos(walk))*0.05;
    const leanTarget=-(wind+gustVis)*(hard?0.18:0.4);lean.rotation.z+=(leanTarget-lean.rotation.z)*Math.min(1,dt*6);
    armL.rotation.z=-0.15-Math.max(0,wind)*0.6;armR.rotation.z=0.15-Math.min(0,wind)*0.6;
    if(hard){armR.rotation.x=0;armR.rotation.z=Math.PI*0.97;}
  }
  if(umb.visible){
    // 開花: canopy flips inside out and flaps
    const inv=flipT>0;
    canopy.scale.set(inv?1.15:1,inv?-1.3:1,inv?1.15:1);
    canopy.rotation.z=inv?Math.sin(t*25)*0.2:-(wind+gustVis)*0.08;
    canopy.rotation.x=inv?Math.cos(t*21)*0.15:0;
  }
  scarf.position.x=wind*0.25;scarf.rotation.z=Math.sin(t*20)*0.15*Math.abs(wind);
  player.position.z=pz;

  // sway props
  segments.forEach(g=>g.userData.dyn.children.forEach(c=>{
    if(c.userData.sway)c.rotation.z=-(wind+gustVis)*0.3+Math.sin(t*4+c.position.z)*0.06*Math.abs(wind);
    if(c.userData.flag){c.rotation.y=Math.PI/2+Math.sin(t*12+c.position.z)*0.25;c.position.x=Math.sign(c.position.x)*1.5+wind*0.28;}
  }));

  // streaks
  const EW=wind+gustVis;
  shake=Math.max(shake,Math.abs(EW)*0.05);
  const W=EW*14, V=hard?windV*7:0;
  const len=0.5+(Math.abs(EW)+Math.abs(V)/14)*2.4;
  const WL=Math.hypot(W,V), ex=WL>1e-3?W/WL:1, ey=WL>1e-3?V/WL:0;
  const yLo=hard?Math.max(0,py-2.5):0, yHi=hard?py+8:99;
  for(let i=0;i<NSTREAK;i++){
    const d=streakData[i];
    d.x+=W*d.sp*dt;d.y+=V*d.sp*dt;
    if(d.x>12||d.x<-12||d.z>pz+8||d.y<yLo||d.y>yHi){resetStreak(d,pz,false);if(d.z>pz+8)d.z=pz-30*Math.random();}
    const o=i*6;
    streakPos[o]=d.x;streakPos[o+1]=d.y;streakPos[o+2]=d.z;
    streakPos[o+3]=d.x-ex*len*d.sp;streakPos[o+4]=d.y-ey*len*d.sp;streakPos[o+5]=d.z;
  }
  streakGeo.attributes.position.needsUpdate=true;
  streaks.material.opacity=Math.min(0.85,0.15+Math.abs(EW)*0.4);
  leaves.forEach((l,i)=>{
    l.x+=W*0.8*dt;l.y+=Math.sin(t*3+i)*dt*0.8;l.r+=dt*8;
    if(Math.abs(l.x)>11||l.z>pz+6||l.y<0.05||l.y>4){l.x=-Math.sign(W||1)*10;l.y=0.2+Math.random()*2.5;l.z=pz+2-Math.random()*28;}
    l.m.position.set(l.x,l.y,l.z);l.m.rotation.set(l.r,l.r*0.7,0);
  });

  // camera
  const cx=(state==='dead'?player.position.x:player.position.x)*0.55;
  shake*=0.9;
  const cy=Math.min(player.position.y,PY_MAX+2)*0.9;
  camera.position.set(cx+(Math.random()-.5)*shake,3.4+cy+(Math.random()-.5)*shake,pz+6.5);
  camera.lookAt(player.position.x*0.35,1.0+cy,pz-7);
  sun.position.set(pz*0-8+player.position.x,14,pz+6);sun.target.position.set(player.position.x,0,pz-2);

  // HUD
  const ms=Math.hypot(wind+gustVis,hard?windV:0)*11.5;
  if(hard){
    $('alt').textContent=py.toFixed(1);
    $('vms').textContent=(windV>=0?'↑ ':'↓ ')+(Math.abs(windV)*11.5).toFixed(1)+' m/s';
  }
  $('dist').textContent=Math.floor(dist);
  $('ms').textContent=ms.toFixed(1)+' m/s';
  const bf=beaufort(ms);$('beau').textContent=bf+' 級';
  $('windName').textContent=bf>=8?NAMES[4]:bf>=7?NAMES[3]:bf>=5?NAMES[1]:bf>=3?NAMES[0]:'微風';
  $('meter').style.width=Math.min(100,ms/50*100)+'%';
  $('meter').style.background=bf>=7?'#e8402b':'#ffcf3a';
  $('arrow').style.transform='rotate('+(hard?-Math.atan2(windV,wind+gustVis)*180/Math.PI:(wind<0?180:0))+'deg)';
  const loud=Math.abs(wind)+(hard?Math.abs(windV)*0.5:0);
  if(windGain&&ac){windGain.gain.setTargetAtTime(muted?0:Math.min(0.5,0.04+loud*0.28),ac.currentTime,0.2);
    windFilt.frequency.setTargetAtTime(250+loud*700,ac.currentTime,0.2);}

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
reset();state='menu';
requestAnimationFrame(frame);
})();
</script>
